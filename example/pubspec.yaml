name: coffee_flutter
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.18.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  moyasar:
    path: ../
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  config:
    # Work around Flutter's local SwiftPM package identity mismatch when the
    # checkout directory is named moyasar-flutter instead of moyasar.
    # https://github.com/flutter/flutter/issues/186881
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/
